spring.application.name=frontend-forge-backend

# Local server: listens only on this machine (D-070, D-071). Before any deployment: HTTPS,
# secure cookies (server.servlet.session.cookie.secure=true) and a shared login throttle.
server.address=127.0.0.1
server.port=8080

spring.datasource.url=jdbc:h2:file:./data/progress;AUTO_SERVER=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always

# Session cookie: not readable by JavaScript, not sent on cross-site requests.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=8h
